# English strings for the module's own screens.
#
# `[module]` is read by the *host* for the module card and the tab title;
# everything else is read by the module. This is the fallback language: a key
# missing from uk.toml is answered from here.

[module]
title = "Windows & Office licences"

[ui]
title = "Windows & Office licences"
subtitle = "Activation state read from this machine's own licensing store. Nothing is activated or changed, and nothing leaves the machine."
scan = "Check licences"
rescan = "Check again"
report = "Make report"
details = "Details"
all_ok = "Everything found is licensed."
attention = "{n} product(s) need attention."

[kind]
windows = "Windows"
office = "Office"
other = "Other products"

[status]
licensed = "Licensed"
unlicensed = "Not licensed"
grace = "Grace period"
notification = "Notification — activation required"
non_genuine = "Not genuine"

[col]
product = "Product"
status = "Status"
channel = "Channel"
key = "Key"
expires = "Expires in"
kms = "KMS host"
item = "Item"
value = "Value"

[note]
no_oem = "The OEM key held in firmware could not be read. On some builds that field needs administrator; everything else here does not."
read_oem = "Read it as administrator"

[oem]
title = "Reading the OEM key"
authorizing = "Waiting for you to allow it"
why = "Windows is asking whether this may run as administrator. The OEM key held in firmware is the one field here that needs it — nothing else is elevated, and the command reads that one property and stops."
refused = "Not allowed, so the OEM key was not read. Everything else on this screen was read without it."
unavailable = "This machine offers no way to ask for administrator, so the OEM key cannot be read here."
failed = "The elevated command did not finish properly, so the OEM key was not read."
none = "Read as administrator, and this machine has no OEM key in its firmware — which is ordinary for an install that was not preloaded by the manufacturer."
item = "OEM key in firmware"

[error]
no_powershell = "PowerShell could not be run, so the licensing store was not read. It is what this machine keeps activation state in — there is no other source."
timeout = "The licensing query did not finish in time. That usually means the Software Protection service is busy or stopped."

[report]
title = "Licence report"
subtitle = "{total} product(s) · {bad} needing attention"
by_status = "Products by status"
line_total = "Products found: {n}"
line_bad = "Not properly licensed: {n}"
nothing = "Nothing has been checked yet."
failed = "Couldn't build the report"
exported = "Report exported"
exported_hint = "The document was generated and opened in your default app."

[module]
name = "ms-licenses"
display_name = "Windows & Office licences"
version = "0.2.0"
language = "native"
entry = "ms_licenses"
abi = "native"
authors = ["Limen"]
repo = "CRC-BARRACUDA/limen-ms-licenses"
tags = ["windows", "licensing", "inventory"]

# Windows only, and the host honours it: a module that names platforms and not
# the running one is dropped at discovery, so this never appears in the module
# manager elsewhere. The licensing store it reads — `SoftwareLicensingProduct`
# and the Click-to-Run registry — exists on no other platform, and an empty
# answer there would read as "nothing is licensed" rather than "wrong machine".
os = ["windows"]

[provides]
capabilities = ["licenses.ms"]

[optional.capabilities]
# When a report provider is installed, a "Make Report" action appears.
"report.build" = ">=0.1"

[permissions]
# Runs PowerShell to query the licensing store. Nothing is activated, rearmed or
# changed — the module reads.
subprocess = true

# For one field, and only when the user asks for it.
#
# The OEM product key held in firmware needs administrator on most builds.
# Everything else here works as an ordinary user and is read without any
# prompt; the scan reports that one field as unreadable and offers a button.
# Pressing it runs a single command — one property, written to a file in this
# module's own directory — and the operating system asks for the privileges.
# Nothing else is elevated, and nothing is elevated without being asked for.
elevate = true

# Deliberately NOT here:
#
#   network — the module never leaves the machine. Activation state is read
#     locally; it does not phone Microsoft and does not report anywhere.
